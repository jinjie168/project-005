(() => {
'use strict';
/* =====================================================================
   SKYFIRE - infinite vertical aircraft shooter (single file)
   Sections: 1 Utils | 2 Storage | 3 RNG | 4 Audio | 5 Art | 6 Backgrounds
   7 Level generation | 8 Pools & entities | 9 Game logic | 10 Render
   11 Input | 12 UI | 13 Boot

/* ---------- 1. UTILS & CONSTANTS ---------- */
const W = 540, H = 960, TAU = Math.PI * 2;

const PLAYER_Y = 790, PLAYER_R = 12, PX_MIN = 46, PX_MAX = W - 46;
const SCROLL = 200, BG_H = 1280, KEY_SPEED = 560, SAFE_SPEED = 420;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('en-US');
const newSeed = () => (Math.random() * 4294967296) >>> 0;
const OUT = 'rgba(8,18,44,.72)';
const DASH = [7, 7], NODASH = [];

/* ---------- 2. STORAGE ---------- */
const Store = {
  key: 'skyfire.v1',
  data: { level: 1, seed: 0, best: 0, maxLevel: 1, coins: 0, owned: ['rookie'], plane: '', sound: true, music: true, score: 0, tier: 1 },
  load() {
    try {
      const s = localStorage.getItem(this.key);
      if (s) {
        const o = JSON.parse(s), d = this.data;
        if (Number.isFinite(o.level) && o.level >= 1) d.level = Math.floor(o.level);
        if (Number.isFinite(o.seed)) d.seed = o.seed >>> 0;
        if (Number.isFinite(o.best)) d.best = Math.max(0, o.best);
        if (typeof o.sound === 'boolean') d.sound = o.sound;
        if (typeof o.music === 'boolean') d.music = o.music;
        if (Number.isFinite(o.score)) d.score = Math.max(0, o.score);
        if (Number.isFinite(o.tier)) d.tier = clamp(Math.floor(o.tier), 1, 3);
        if (Number.isFinite(o.maxLevel)) d.maxLevel = Math.max(1, Math.floor(o.maxLevel));
        d.maxLevel = Math.max(d.maxLevel || 1, d.level);
        if (Number.isFinite(o.coins)) d.coins = Math.max(0, Math.floor(o.coins));
        if (Array.isArray(o.owned)) d.owned = o.owned.filter(x => typeof x === 'string');
        if (d.owned.indexOf('rookie') < 0) d.owned.push('rookie');
        if (typeof o.plane === 'string') d.plane = o.plane;
      }
    } catch (e) {}
    if (!this.data.seed) this.data.seed = newSeed();
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} }
};

/* ---------- 3. SEEDED RNG ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(n) { return Math.floor(this.f() * n); }
  pick(a) { return a[this.int(a.length)]; }
  chance(p) { return this.f() < p; }
  sign() { return this.f() < .5 ? -1 : 1; }
}
const levelSeedMix = (seed, level) => (seed ^ Math.imul(level | 0, 0x9E3779B1)) >>> 0;

/* ---------- 4. AUDIO (Web Audio, fully procedural) ---------- */
const Sfx = {
  ctx: null, master: null, sfxG: null, musG: null, noiseBuf: null, on: true, musOn: true, stamp: {}, step: 0, nextT: 0,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(c.destination);
      this.sfxG = c.createGain(); this.sfxG.gain.value = this.on ? 0.8 : 0; this.sfxG.connect(this.master);
      this.musG = c.createGain(); this.musG.gain.value = this.musOn ? 0.4 : 0; this.musG.connect(this.master);
      const len = c.sampleRate * 1.5, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;

  },
  unlock() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  setOn(v) { this.on = v; if (this.sfxG) this.sfxG.gain.setTargetAtTime(v ? 0.8 : 0, this.ctx.currentTime, 0.02); },
  setMus(v) { this.musOn = v; if (this.musG) this.musG.gain.setTargetAtTime(v ? 0.4 : 0, this.ctx.currentTime, 0.02); },
  ok() { return !!this.ctx && this.ctx.state === 'running'; },
  gate(k, ms) { const n = performance.now(); if (n - (this.stamp[k] || 0) < ms) return false; this.stamp[k] = n; return true; },
  tone(f, d, type, v, slide, delay, dest) {
    if (!this.ok() || (!dest && !this.on)) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, v, f0, f1, type, delay, dest) {
    if (!this.ok() || (!dest && !this.on)) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; fl.type = type || 'lowpass';
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(dest || this.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
  },
  shoot(pw) { if (this.ok() && this.gate('sh', 95)) this.tone(pw ? 520 : 900, 0.07, 'square', 0.022, pw ? 180 : 420); },
  explode(sz) { if (!this.gate('ex', 40)) return; this.noise(0.25 + sz * 0.12, 0.32, 1800, 120); this.tone(110, 0.25 + sz * .1, 'sine', 0.28, 40); },
  hit() { this.noise(0.5, 0.45, 2500, 80); this.tone(180, 0.4, 'sawtooth', 0.22, 50); },
  pickup() { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.16, 0, i * 0.06)); },
  shield() { this.tone(500, 0.3, 'sine', 0.2, 1000); },
  bossIn() { for (let i = 0; i < 5; i++) this.tone(i % 2 ? 330 : 470, 0.3, 'sawtooth', 0.1, 0, i * 0.32); this.tone(55, 1.8, 'sine', 0.3, 40); },
  bossHit() { if (this.gate('bh', 70)) this.tone(240, 0.05, 'square', 0.045, 120); },
  bossDie() { this.noise(1.8, 0.5, 2200, 60); this.tone(90, 1.6, 'sawtooth', 0.22, 28); },
  warn() { this.tone(880, 0.12, 'square', 0.08); this.tone(880, 0.12, 'square', 0.08, 0, 0.2); this.tone(1175, 0.2, 'square', 0.08, 0, 0.4); },
  finish() { this.tone(400, 0.6, 'triangle', 0.2, 1600); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.16, 0, 0.1 + i * 0.09)); },
  complete() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.25, 'square', 0.07, 0, i * 0.12)); },
  over() { this.tone(440, 1.0, 'sawtooth', 0.18, 90); this.noise(0.9, 0.25, 900, 60); },
  engine() { this.noise(1.4, 0.2, 200, 1400, 'lowpass'); this.tone(45, 1.6, 'sawtooth', 0.14, 150); },
  takeoff() { this.noise(2.0, 0.22, 400, 2800, 'bandpass'); },
  click() { this.tone(700, 0.06, 'square', 0.07); },
  thunder() { if (this.gate('th', 1500)) this.noise(0.9, 0.18, 900, 70); },
  musicTick() {
    if (!this.ok() || !this.musOn) return;
    const c = this.ctx;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.2) { this.musicStep(this.nextT); this.nextT += 60 / 156 / 4; }
  },
  musicStep(t) {
    const c = this.ctx, s = this.step++, st = s % 16, bar = Math.floor(s / 16) % 8, dl = t - c.currentTime, M = this.musG;
    const roots = [55, 43.65, 65.41, 49, 55, 43.65, 49, 41.2], r = roots[bar], ch = (bar === 0 || bar === 4) ? [0, 3, 7] : [0, 4, 7];
    if (st % 4 === 0 || (st === 10 && bar % 2)) this.tone(160, 0.14, 'sine', 0.5, 45, dl, M);
    if (st === 4 || st === 12) { this.noise(0.13, 0.22, 3800, 1400, 'bandpass', dl, M); this.tone(210, 0.08, 'triangle', 0.12, 110, dl, M); }
    this.noise(0.03, st % 4 === 2 ? 0.08 : 0.04, 8000, 7000, 'highpass', dl, M);
    if (st % 2 === 0) this.tone(r * (st % 4 === 2 ? 2 : 1), 0.15, 'sawtooth', 0.14, 0, dl, M);
    this.tone(r * 4 * Math.pow(2, ch[[0, 1, 2, 1, 2, 1, 0, 1][st % 8]] / 12), 0.08, 'square', 0.04, 0, dl, M);
    if (st === 0 || st === 6 || st === 10) this.tone(r * 8 * Math.pow(2, ch[(bar + st / 2) % 3 | 0] / 12), 0.3, 'sawtooth', 0.05, 0, dl, M);
    if (st === 0 && bar % 4 === 0) this.noise(0.7, 0.16, 9000, 3000, 'highpass', dl, M);
  }

/* ---------- 5. ART (procedural canvas sprites) ---------- */
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function sprite(w, h, fn, flip) {
  const S = 2, cv = mk(w * S, h * S), c = cv.getContext('2d');
  c.scale(S, S); c.translate(w / 2, h / 2); if (flip) c.rotate(Math.PI); fn(c);
  cv.lw = w; cv.lh = h; return cv;
}
function tinted(src, color) {
  const cv = mk(src.width, src.height), c = cv.getContext('2d');
  c.drawImage(src, 0, 0); c.globalCompositeOperation = 'source-atop'; c.fillStyle = color; c.fillRect(0, 0, cv.width, cv.height);
  cv.lw = src.lw; cv.lh = src.lh; return cv;
}
const dispImg = (c, img, x, y, s) => { s = s || 1; c.drawImage(img, x - img.lw * s / 2, y - img.lh * s / 2, img.lw * s, img.lh * s); };
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };

const jg = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < st.length; i += 2) g.addColorStop(st[i], st[i + 1]); return g; };

function drawJet(c, o) {

  c.lineJoin = 'round'; c.lineWidth = 2.2; c.strokeStyle = OUT;

    c.beginPath(); c.moveTo(s * bw * .6, ty); c.lineTo(s * o.tailSpan / 2, ty + o.tailSweep); c.lineTo(s * o.tailSpan / 2, ty + o.tailSweep + o.tailChord); c.lineTo(s * bw * .6, ty + o.tailChord * 1.1); c.closePath();
    c.fillStyle = jg(c, 0, 0, s * o.tailSpan / 2, 0, [0, p.b, 1, p.c]); c.fill(); c.stroke();

    c.beginPath(); c.moveTo(wx, wy); c.lineTo(tx, wy + sw); c.lineTo(tx, wy + sw + tc); c.lineTo(wx, wy + ch); c.closePath();
    c.fillStyle = jg(c, wx, 0, tx, 0, [0, p.a, .6, p.b, 1, p.c]); c.fill(); c.stroke();

  }

    const kx = clamp((px - bw * .7) / (o.span / 2 - bw * .7), 0, 1), yl = o.wy + o.sweep * kx - o.podL * .15, pl = o.podL, pw = o.podW, x = s * px;

  c.globalAlpha = .9; c.fillRect(-bw * .35, hl * .3, bw * .7, hl * .5); c.globalAlpha = 1;

  c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-bw * .45, -hl * .55); c.quadraticCurveTo(-bw * .72, -hl * .1, -bw * .62, hl * .55); c.stroke();
  c.strokeStyle = OUT; c.lineWidth = 2.2;
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * bw * .5, hl * .42); c.lineTo(s * bw * 1.25, hl * .86); c.lineTo(s * bw * .9, hl * .99); c.lineTo(s * bw * .35, hl * .85); c.closePath();

  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-cw * .3, cy - chh * .35, cw * .25, chh * .3, 0, 0, TAU); c.fill();

const JETS = {
