<!DOCTYPE html>
<html lang="en">
<head>

<title>SKYFIRE - Infinite Aircraft Shooter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#050d22}
body{position:fixed;inset:0;font-family:"Arial Black","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:#fff;background:radial-gradient(120% 90% at 50% 40%,#12347a 0%,#071a40 55%,#030a1c 100%);-webkit-touch-callout:none}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:540px;height:960px;font-size:16px;overflow:hidden;border-radius:.6em;background:#0a3b78;box-shadow:0 0 0 .12em rgba(120,190,255,.25),0 1.2em 4em rgba(0,0,0,.6)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#safeProbe{position:fixed;left:0;top:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5;padding:2em}
.ov.show{display:flex;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
.btn{cursor:pointer;border:0;font:inherit;font-size:1.7em;font-weight:900;font-style:italic;letter-spacing:.04em;color:#4a2000;padding:.45em 1.7em;border-radius:999px;background:linear-gradient(#fff08a,#ffbf26 50%,#ff8a00);box-shadow:0 .2em 0 #b45a00,0 .45em .8em rgba(0,0,0,.4),inset 0 .08em 0 rgba(255,255,255,.8);text-shadow:0 .05em 0 rgba(255,255,255,.55);display:inline-flex;align-items:center;gap:.5em;transition:transform .08s;min-width:9em;justify-content:center;touch-action:manipulation}
.btn:active{transform:translateY(.15em);box-shadow:0 .05em 0 #b45a00,0 .2em .4em rgba(0,0,0,.4),inset 0 .08em 0 rgba(255,255,255,.8)}
.btn.big{font-size:2.3em;animation:pulse 1.6s ease-in-out infinite}
.btn.sec{color:#fff;background:linear-gradient(#5cc2ff,#2c86e8 55%,#1c5fc4);box-shadow:0 .2em 0 #123f8f,0 .45em .8em rgba(0,0,0,.4),inset 0 .08em 0 rgba(255,255,255,.55);text-shadow:0 .06em 0 rgba(0,30,90,.6);font-size:1.25em;min-width:11em}

.ttl.gold{background:linear-gradient(#fff4a6,#ffb81f 55%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.05em #7a2a00;filter:drop-shadow(0 .06em 0 #5a1d00) drop-shadow(0 0 .5em rgba(255,200,60,.7))}
.ttl.red{background:linear-gradient(#ffb0a0,#ff4a3a 55%,#c91414);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.05em #4a0606;filter:drop-shadow(0 .06em 0 #3a0404) drop-shadow(0 .2em .3em rgba(0,0,0,.5))}

.val{font-size:2.1em;font-weight:900;font-style:italic;text-shadow:0 .08em .2em rgba(0,0,0,.5)}
.val.sm{font-size:1.5em}
.stack{display:flex;flex-direction:column;align-items:center;gap:.8em;margin-top:1.1em}

#pauseOv,#victory,#gameover{background:rgba(4,14,40,.55)}
#gameover{background:rgba(30,6,10,.6)}

<body>
<div id="stage">
 <div id="wrap">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" class="icon" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#fff"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#fff"/></svg></button>

  <div id="menu" class="ov show">
   <button id="sndBtn" class="icon snd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z" fill="#fff"/><g class="waves" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></g><path class="x" d="M15 9l6 6M21 9l-6 6" stroke="#ff8a8a" stroke-width="2.4" stroke-linecap="round"/></svg></button>
   <div style="display:flex;flex-direction:column;align-items:center;margin-top:.6em"><div class="logo"><span class="l1">SKY</span><span class="l2">FIRE</span></div><div class="tag">MODERN AIR COMBAT</div></div>
   <div class="bot">

   <svg class="emb" viewBox="0 0 120 80"><path d="M60 4l9 20 22 2-17 15 5 22-19-12-19 12 5-22-17-15 22-2z" fill="#ffc82e" stroke="#8a4300" stroke-width="3" stroke-linejoin="round"/><path d="M4 30l40 10-6 12zM116 30l-40 10 6 12z" fill="#ff9d1c" stroke="#8a4300" stroke-width="3" stroke-linejoin="round"/></svg>

   </div>
   <div class="stack"><button id="retryBtn" class="btn big" style="font-size:1.9em">RETRY</button><button id="newLayoutBtn" class="btn sec" style="font-size:1em">NEW LAYOUT</button><button id="menuBtn2" class="link">MAIN MENU</button></div>
  </div>
 </div>
</div>
<div id="safeProbe"></div>

<script>
(() => {
'use strict';
/* =====================================================================
   SKYFIRE - infinite vertical aircraft shooter (single file)
   Sections: 1 Utils | 2 Storage | 3 RNG | 4 Audio | 5 Art | 6 Backgrounds
   7 Level generation | 8 Pools & entities | 9 Game logic | 10 Render
   11 Input | 12 UI | 13 Boot
   ===================================================================== */

/* ---------- 1. UTILS & CONSTANTS ---------- */
const W = 540, H = 960, TAU = Math.PI * 2;
const PLAYER_Y = 790, PLAYER_R = 12, PX_MIN = 46, PX_MAX = W - 46;
const SCROLL = 200, BG_H = 1280, KEY_SPEED = 560, SAFE_SPEED = 420;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const $ = id => document.getElementById(id);
const fmt = n => Math.floor(n).toLocaleString('en-US');
const newSeed = () => (Math.random() * 4294967296) >>> 0;
const OUT = 'rgba(8,18,44,.72)';
const DASH = [7, 7], NODASH = [];

/* ---------- 2. STORAGE ---------- */
const Store = {
  key: 'skyfire.v1',
  data: { level: 1, seed: 0, best: 0, sound: true, score: 0, tier: 1 },
  load() {
    try {
      const s = localStorage.getItem(this.key);
      if (s) {
        const o = JSON.parse(s), d = this.data;
        if (Number.isFinite(o.level) && o.level >= 1) d.level = Math.floor(o.level);
        if (Number.isFinite(o.seed)) d.seed = o.seed >>> 0;
        if (Number.isFinite(o.best)) d.best = Math.max(0, o.best);
        if (typeof o.sound === 'boolean') d.sound = o.sound;
        if (Number.isFinite(o.score)) d.score = Math.max(0, o.score);
        if (Number.isFinite(o.tier)) d.tier = clamp(Math.floor(o.tier), 1, 3);
      }
    } catch (e) {}
    if (!this.data.seed) this.data.seed = newSeed();
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} }
};

/* ---------- 3. SEEDED RNG ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(n) { return Math.floor(this.f() * n); }
  pick(a) { return a[this.int(a.length)]; }
  chance(p) { return this.f() < p; }
  sign() { return this.f() < .5 ? -1 : 1; }
}
const levelSeedMix = (seed, level) => (seed ^ Math.imul(level | 0, 0x9E3779B1)) >>> 0;

/* ---------- 4. AUDIO (Web Audio, fully procedural) ---------- */
const Sfx = {
  ctx: null, master: null, sfxG: null, musG: null, noiseBuf: null, on: true, stamp: {}, step: 0, nextT: 0,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.on ? 0.9 : 0; this.master.connect(c.destination);
      this.sfxG = c.createGain(); this.sfxG.gain.value = 0.8; this.sfxG.connect(this.master);
      this.musG = c.createGain(); this.musG.gain.value = 0.38; this.musG.connect(this.master);
      const len = c.sampleRate * 1.5, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    } catch (e) { this.ctx = null; }
  },
  unlock() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.02); },
  ok() { return this.on && this.ctx && this.ctx.state === 'running'; },
  gate(k, ms) { const n = performance.now(); if (n - (this.stamp[k] || 0) < ms) return false; this.stamp[k] = n; return true; },
  tone(f, d, type, v, slide, delay, dest) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.sfxG); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, v, f0, f1, type, delay, dest) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (delay || 0), s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; fl.type = type || 'lowpass';
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(dest || this.sfxG); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
  },
  shoot(pw) { if (this.ok() && this.gate('sh', 95)) this.tone(pw ? 520 : 900, 0.07, 'square', 0.022, pw ? 180 : 420); },
  explode(sz) { if (!this.gate('ex', 40)) return; this.noise(0.25 + sz * 0.12, 0.32, 1800, 120); this.tone(110, 0.25 + sz * .1, 'sine', 0.28, 40); },
  hit() { this.noise(0.5, 0.45, 2500, 80); this.tone(180, 0.4, 'sawtooth', 0.22, 50); },
  pickup() { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.16, 0, i * 0.06)); },
  shield() { this.tone(500, 0.3, 'sine', 0.2, 1000); },
  bossIn() { for (let i = 0; i < 5; i++) this.tone(i % 2 ? 330 : 470, 0.3, 'sawtooth', 0.1, 0, i * 0.32); this.tone(55, 1.8, 'sine', 0.3, 40); },
  bossHit() { if (this.gate('bh', 70)) this.tone(240, 0.05, 'square', 0.045, 120); },
  bossDie() { this.noise(1.8, 0.5, 2200, 60); this.tone(90, 1.6, 'sawtooth', 0.22, 28); },
  warn() { this.tone(880, 0.12, 'square', 0.08); this.tone(880, 0.12, 'square', 0.08, 0, 0.2); this.tone(1175, 0.2, 'square', 0.08, 0, 0.4); },
  finish() { this.tone(400, 0.6, 'triangle', 0.2, 1600); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.16, 0, 0.1 + i * 0.09)); },
  complete() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.25, 'square', 0.07, 0, i * 0.12)); },
  over() { this.tone(440, 1.0, 'sawtooth', 0.18, 90); this.noise(0.9, 0.25, 900, 60); },
  engine() { this.noise(1.4, 0.2, 200, 1400, 'lowpass'); this.tone(45, 1.6, 'sawtooth', 0.14, 150); },
  takeoff() { this.noise(2.0, 0.22, 400, 2800, 'bandpass'); },
  click() { this.tone(700, 0.06, 'square', 0.07); },
  thunder() { if (this.gate('th', 1500)) this.noise(0.9, 0.18, 900, 70); },
  musicTick() {
    if (!this.ok()) return;
    const c = this.ctx;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;
    while (this.nextT < c.currentTime + 0.2) { this.musicStep(this.nextT); this.nextT += 60 / 132 / 2; }
  },
  musicStep(t) {
    const c = this.ctx, s = this.step++, bar = Math.floor(s / 16) % 4, dl = t - c.currentTime;
    const roots = [110, 87.31, 130.81, 98], ch = [[0, 3, 7, 12], [0, 4, 7, 12], [0, 4, 7, 12], [0, 4, 7, 11]];
    const r = roots[bar];
    if (s % 2 === 0) this.tone(r, 0.22, 'triangle', 0.17, 0, dl, this.musG);
    const ar = [0, 2, 1, 3, 2, 1, 3, 2][s % 8];
    this.tone(r * 2 * Math.pow(2, ch[bar][ar] / 12), 0.14, 'sine', 0.1, 0, dl, this.musG);
    if (s % 4 === 0) this.tone(120, 0.18, 'sine', 0.3, 45, dl, this.musG);
    if (s % 2 === 1) this.noise(0.04, 0.05, 7000, 6000, 'highpass', dl, this.musG);
  }
};

/* ---------- 5. ART (procedural canvas sprites) ---------- */
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function sprite(w, h, fn, flip) {
  const S = 2, cv = mk(w * S, h * S), c = cv.getContext('2d');
  c.scale(S, S); c.translate(w / 2, h / 2); if (flip) c.rotate(Math.PI); fn(c);
  cv.lw = w; cv.lh = h; return cv;
}
function tinted(src, color) {
  const cv = mk(src.width, src.height), c = cv.getContext('2d');
  c.drawImage(src, 0, 0); c.globalCompositeOperation = 'source-atop'; c.fillStyle = color; c.fillRect(0, 0, cv.width, cv.height);
  cv.lw = src.lw; cv.lh = src.lh; return cv;
}
const dispImg = (c, img, x, y, s) => { s = s || 1; c.drawImage(img, x - img.lw * s / 2, y - img.lh * s / 2, img.lw * s, img.lh * s); };
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function cap(c, x, y, w, h) { const r = w / 2; c.beginPath(); c.moveTo(x - r, y - h / 2 + r); c.arc(x, y - h / 2 + r, r, Math.PI, 0); c.lineTo(x + r, y + h / 2 - r); c.arc(x, y + h / 2 - r, r, 0, Math.PI); c.closePath(); }
const jg = (c, x0, y0, x1, y1, st) => { const g = c.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < st.length; i += 2) g.addColorStop(st[i], st[i + 1]); return g; };

function drawJet(c, o) {
  const L = o.L, hl = L / 2, bw = o.bw, p = o.pal;
  c.lineJoin = 'round'; c.lineWidth = 2.2; c.strokeStyle = OUT;
  const ty = hl * o.tailY;
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * bw * .6, ty); c.lineTo(s * o.tailSpan / 2, ty + o.tailSweep); c.lineTo(s * o.tailSpan / 2, ty + o.tailSweep + o.tailChord); c.lineTo(s * bw * .6, ty + o.tailChord * 1.1); c.closePath();
    c.fillStyle = jg(c, 0, 0, s * o.tailSpan / 2, 0, [0, p.b, 1, p.c]); c.fill(); c.stroke();
  }
  for (const s of [-1, 1]) {

    if (boss.hp > 0) { rr(c, x + 2, y + 2, Math.max(8, (w - 4) * boss.hp / boss.mhp), 12, 6); c.fillStyle = jg(c, 0, y, 0, y + 16, [0, '#ff9a8a', 1, '#d11c1c']); c.fill(); }
    txt(BOSS_NAMES[boss.idx], W / 2, y + 30, 12, '#ffd9d2', 'center', ST, 4);
  }
  if (finish.on && !finish.crossed && state === 'FINISH_APPROACH' && Math.floor(performance.now() / 300) % 2 === 0) { rr(c, W / 2 - 82, top + 100, 164, 30, 15); c.fillStyle = 'rgba(255,200,40,.92)'; c.fill(); txt('FINISH AHEAD', W / 2, top + 116, 15, '#4a2000', 'center'); }
}
function drawBanner(c) {

  if (banner.sub) txt(banner.sub, 0, 54, 20, '#fff', 'center', 'rgba(5,20,70,.95)', 6);

}
function drawRunway(c, p) {
  const sy = wy => PLAYER_Y + 25 - (wy - p), t = performance.now() / 1000, water = bg.thA.water || bg.thA.sky;
  const padTop = sy(1400), padBot = sy(-500);
  c.fillStyle = 'rgba(0,20,60,.3)'; c.fillRect(54, padTop + 8, W - 108, padBot - padTop);
  c.fillStyle = water ? '#76869c' : '#b4bfcc'; rr(c, 44, padTop, W - 88, padBot - padTop, 22); c.fill(); c.strokeStyle = water ? '#d9e4f2' : '#f0f4f9'; c.lineWidth = 6; c.stroke();
  const rt = sy(1300), rb = sy(-300); c.fillStyle = '#394050'; c.fillRect(200, rt, 140, rb - rt);
  c.fillStyle = '#fff'; c.fillRect(204, rt, 4, rb - rt); c.fillRect(332, rt, 4, rb - rt);
  const wMax = p + 830, wMin = p - 160;
  for (let w = Math.floor(wMin / 70) * 70; w < wMax; w += 70) { if (w < -250 || w > 1250) continue; c.fillStyle = '#ffe9a0'; c.fillRect(267, sy(w + 36), 6, 36); }
  for (let k = 0; k < 8; k++) { c.fillStyle = '#fff'; c.fillRect(212 + k * 14, sy(-120), 8, 50); c.fillRect(212 + k * 14, sy(1290) , 8, 50); }
  c.globalCompositeOperation = 'lighter';
  for (let w = Math.floor(wMin / 90) * 90; w < wMax; w += 90) { if (w < -280 || w > 1300) continue; const a = .5 + .5 * Math.sin(t * 8 - w * .02); for (const x of [194, 346]) glow(c, 'yellow', x, sy(w), 9, a); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  const bld = (x, w0, bw, bh, col, roof) => { const y1 = sy(w0 + bh), y2 = sy(w0); if (y2 < -20 || y1 > H + 20) return; c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(x + 8, y1 + 10, bw, y2 - y1); c.fillStyle = col; c.fillRect(x, y1, bw, y2 - y1); c.fillStyle = roof; c.fillRect(x + 4, y1 + 4, bw - 8, y2 - y1 - 8); c.fillStyle = 'rgba(255,255,255,.3)'; c.fillRect(x + 4, y1 + 4, bw - 8, 5); };
  bld(62, 200, 100, 190, '#8a98ad', '#dfe7f2'); bld(62, 500, 80, 100, '#8a98ad', '#cfd9e8'); bld(380, 700, 100, 170, '#8a98ad', '#e3d6c2'); bld(392, 380, 70, 90, '#8a98ad', '#d6e0ee');
  const ty = sy(560); if (ty > -60 && ty < H + 60) { c.fillStyle = 'rgba(0,0,0,.28)'; c.beginPath(); c.arc(436, ty + 12, 24, 0, TAU); c.fill(); c.fillStyle = '#dfe7f2'; c.beginPath(); c.arc(430, ty, 24, 0, TAU); c.fill(); c.fillStyle = '#4aa9e8'; c.beginPath(); c.arc(430, ty, 14, 0, TAU); c.fill(); c.strokeStyle = '#8a98ad'; c.lineWidth = 3; c.stroke(); }
}
function drawTakeoff(c) {
  drawBGTile(c, bg.A, bgScroll, 1); drawRunway(c, take.p); drawClouds(c); drawLight(c);
  const t = take.t, sc = .94 + .26 * smooth((t - 1.6) / 1.1) - .2 * smooth((t - 2.8) / .5), off = 6 + 50 * smooth((t - 1.9) / 1), sa = (t < 1.9 ? .3 : .25) * (1 - smooth((t - 2.7) / .5));
  const fl = 16 + 44 * clamp(scrollV / 900, 0, 1) + (t < .9 ? 8 * Math.sin(t * 40) + 10 : 0);
  drawPlayer(c, px, py, sc, off, sa, fl);
  drawParticles(c);
}
function drawMenuScene(c) {
  drawBGTile(c, bg.A, bgScroll, 1); drawClouds(c); drawLight(c);
  const t = menuT; c.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 14; i++) { const x = (i * 83.7) % W, y = ((i * 211 + t * 520) % (H + 200)) - 100; c.fillRect(x, y, 2.5, 80 + (i % 4) * 30); }
  const y = 560 + Math.sin(t * 1.6) * 12, x = W / 2 + Math.sin(t * .8) * 18; bank = Math.cos(t * .8) * .5;
  c.save(); drawPlayerBig(c, x, y, 1.7, 70 + 14 * Math.sin(t * 30)); c.restore();
  drawWeather(c);
}
function drawPlayerBig(c, x, y, sc, fl) {
  c.globalAlpha = .22; dispImg(c, SPR.player.s, x + 50, y + 80, sc); c.globalAlpha = 1;
  c.globalCompositeOperation = 'lighter';
  for (const ex of [-8, 8]) { drawFlameAt(c, SPR.flameB, x + ex * sc, y + 46 * sc, 16 * sc, fl * sc); glow(c, 'orange', x + ex * sc, y + 50 * sc, 30, .6); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.save(); c.translate(x, y); c.rotate(bank * .07); c.scale(sc, sc); dispImg(c, SPR.player.n, 0, 0, 1); c.restore();
}
function render() {
  const c = ctx; c.setTransform(view.sx, 0, 0, view.sy, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.save();
  if (shake > .3 && state !== 'PAUSED') c.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  if (state === 'MENU') drawMenuScene(c);
  else if (state === 'TAKEOFF') drawTakeoff(c);
  else {
    drawBG(c); drawClouds(c); drawLight(c); drawFinish(c); drawObstacles(c); drawPowerups(c); drawEnemies(c); drawBoss(c); drawBullets(c);
    if (!dead && py > -120) drawPlayer(c, px, py, 1, 24, .22, state === 'FINISH_CROSSING' ? 90 : 34);
    drawEBullets(c); drawParticles(c); drawWeather(c);
  }
  c.restore();
  if (state !== 'MENU') {
    c.globalAlpha = .8; c.drawImage(SPR.vig, 0, 0, W, H); c.globalAlpha = 1;
    if (flashA > .01) { c.fillStyle = 'rgba(' + flashC + ',' + Math.min(.8, flashA) + ')'; c.fillRect(0, 0, W, H); }
    if (boss.on && boss.st === 0) { const a = .2 + .2 * Math.sin(boss.t * 10); const g = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .7); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(255,30,30,' + (a + .2) + ')'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
    if (state !== 'LEVEL_COMPLETE' && state !== 'GAME_OVER') drawHUD(c);
    drawBanner(c);

}

/* ---------- 11. INPUT ---------- */
function setupInput() {
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); Sfx.unlock(); if (input.drag) return;
    input.drag = true; input.id = e.pointerId; input.startX = e.clientX; input.startPx = px; input.target = px;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  });
  cv.addEventListener('pointermove', e => { if (input.drag && e.pointerId === input.id) { e.preventDefault(); input.target = clamp(input.startPx + (e.clientX - input.startX) / view.scale, PX_MIN, PX_MAX); } });
  const end = e => { if (e.pointerId === input.id) { input.drag = false; input.id = -1; } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
  document.addEventListener('pointerdown', () => Sfx.unlock(), true);
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    Sfx.unlock();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; e.preventDefault(); }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; e.preventDefault(); }
    else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'PAUSED') resume(); else if (canPause()) pause(); }
    else if (e.code === 'Enter' || e.code === 'Space') { if (state === 'MENU') $('playBtn').click(); else if (state === 'LEVEL_COMPLETE') $('nextBtn').click(); else if (state === 'GAME_OVER') $('retryBtn').click(); else if (state === 'PAUSED') resume(); if (e.code === 'Space') e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false; else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; input.drag = false; if (canPause()) pause(); });
}

/* ---------- 12. UI ---------- */
const OVERLAYS = ['menu', 'pauseOv', 'victory', 'gameover'];
function showOv(id) { for (const o of OVERLAYS) $(o).classList.toggle('show', o === id); }
function updateSoundUI() { $('sndBtn').classList.toggle('muted', !Sfx.on); $('sndBtn2').textContent = 'SOUND: ' + (Sfx.on ? 'ON' : 'OFF'); }
function toggleSound() { Sfx.unlock(); Sfx.setOn(!Sfx.on); Store.data.sound = Sfx.on; Store.save(); updateSoundUI(); Sfx.click(); }
function updateMenuInfo() { $('menuInfo').textContent = 'LEVEL ' + fmt(Store.data.level) + '  \u2022  BEST ' + fmt(Store.data.best); $('resetBtn').style.display = Store.data.level > 1 ? '' : 'none'; }
function pause() { if (!canPause()) return; prevState = state; state = 'PAUSED'; input.drag = false; showOv('pauseOv'); $('pauseBtn').style.display = 'none'; updateSoundUI(); }
function resume() { if (state !== 'PAUSED') return; state = prevState; input.drag = false; showOv(null); $('pauseBtn').style.display = canPause() ? 'flex' : 'none'; Sfx.unlock(); }
function toMenu() {
  resetWorld(); setupBackground(1, 12345); initAmbient(); state = 'MENU'; menuT = 0; bgScroll = 0; flightT = 0; bg.f = 0;
  $('pauseBtn').style.display = 'none'; updateMenuInfo(); showOv('menu');
}
function wireUI() {
  const on = (id, fn) => $(id).addEventListener('click', e => { e.preventDefault(); Sfx.unlock(); fn(); });
  on('playBtn', () => { Sfx.click(); levelStart = { score: Store.data.score, tier: Store.data.tier }; startLevel(Store.data.level, Store.data.seed); });
  on('resetBtn', () => { Store.data.level = 1; Store.data.score = 0; Store.data.tier = 1; Store.data.seed = newSeed(); Store.save(); updateMenuInfo(); Sfx.click(); });
  on('sndBtn', toggleSound); on('sndBtn2', toggleSound);
  on('pauseBtn', () => { Sfx.click(); pause(); });
  on('resumeBtn', () => { Sfx.click(); resume(); });
  on('restartBtn', () => { Sfx.click(); startLevel(level, levelSeed); });
  on('menuBtn', () => { Sfx.click(); toMenu(); }); on('menuBtn2', () => { Sfx.click(); toMenu(); });
  on('nextBtn', () => { Sfx.click(); levelStart = { score: score, tier: tier }; startLevel(nextLevel, nextSeed); });
  on('retryBtn', () => { Sfx.click(); startLevel(level, levelSeed); });
  on('newLayoutBtn', () => { Sfx.click(); startLevel(level, newSeed()); });
  $('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
}
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight; let h = Math.min(vh, 1000), w = h * 9 / 16;
  if (w > vw) { w = vw; h = w * 16 / 9; }
  w = Math.floor(w); h = Math.floor(w * 16 / 9);
  const wrap = $('wrap'); wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.fontSize = (w / W * 16) + 'px'; wrap.style.borderRadius = w >= vw - 1 ? '0' : '';
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, 1000 / w));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); view.scale = w / W; view.sx = cv.width / W; view.sy = cv.height / H;
  const safePx = $('safeProbe').offsetHeight || 0, bar = (vh - h) / 2; view.safe = Math.max(0, (safePx - Math.max(0, bar)) / view.scale);
}

/* ---------- 13. LOOP & BOOT ---------- */
let rafId = 0, last = 0;
function frame(ts) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (ts - last) / 1000) || 0); last = ts;
  update(dt); render();
}
function startLoop() { if (rafId) return; last = performance.now(); rafId = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (canPause()) pause(); cancelAnimationFrame(rafId); rafId = 0; Sfx.suspend(); keys.left = keys.right = false; input.drag = false; }
  else { startLoop(); if (Sfx.ctx && Sfx.on && state !== 'PAUSED') Sfx.ctx.resume(); }

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

Store.load();
{ const m = /level=(\d+)/.exec(location.hash || ''); if (m) { Store.data.level = Math.max(1, parseInt(m[1], 10)); Store.data.seed = newSeed(); Store.data.score = 0; } }
Sfx.on = Store.data.sound !== false;

setupBackground(1, 12345); initAmbient(); updateMenuInfo(); resize(); startLoop();
})();
